# Real guest entry through the UI: code, name search, pick, skip notifications.
#   maestro --device "$GL_UDID_S" test -e DEVCLIENT_URL="$GL_DEVCLIENT_URL" .maestro/invite-ui.yaml
# Only the demo-review code. /auth/guest/open allows 10 calls a minute per IP.
appId: com.zcventures.guestly
env:
  CODE: ${CODE || 'CAMAND'}
  QUERY: ${QUERY || 'Sof'}
---
- runFlow: launch.yaml
- extendedWaitUntil:
    visible:
      id: "entrance-guest"
    timeout: 120000
- tapOn:
    id: "entrance-guest"
- extendedWaitUntil:
    visible:
      id: "invite-open"
    timeout: 15000
# The screen opens by itself when the sixth character lands (invite.tsx effect).
# No tap on invite-open: it would call /auth/guest/open a second time.
- inputText: ${CODE}
- extendedWaitUntil:
    visible:
      id: "find-input"
    timeout: 30000
- inputText: ${QUERY}
- extendedWaitUntil:
    visible:
      id: "find-row-0"
    timeout: 30000
- tapOn:
    id: "find-row-0"
# find.tsx asks for /notify, but the session gate in _layout.tsx treats /find
# as an entrance and moves a fresh guest to /guest first (seen Sep 18: the
# notification step never showed through the real UI; audit lead H29). The
# flow accepts both paths so it keeps working once that is fixed.
- extendedWaitUntil:
    visible:
      id: "notify-skip"
    timeout: 8000
    optional: true
- tapOn:
    id: "notify-skip"
    optional: true
- extendedWaitUntil:
    visible:
      id: "tab-rsvp"
    timeout: 30000
