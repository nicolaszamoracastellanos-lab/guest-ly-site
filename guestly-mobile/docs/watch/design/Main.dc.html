<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Countdown</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 416px; height: 496px; box-sizing: border-box; background: #000000; color: #f7f3ec; font-family: 'Jost', system-ui, sans-serif; padding: 30px 24px 28px; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 7px; padding-left: 12px; height: 40px; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 32px; font-weight: 600; color: #f7f3ec">
<span>Guest</span>
<span aria-hidden="true" style="display: block; width: 9px; height: 9px; background: {{accent}}; transform: rotate(45deg); margin-top: 6px"></span>
<span style="font-style: italic; font-weight: 500">ly</span>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
<div style="font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 184px; line-height: 150px; letter-spacing: -4px; color: #f7f3ec">132</div>
<div style="font-size: 24px; font-weight: 500; letter-spacing: 5px; text-transform: uppercase; color: {{accent}}; margin-top: 14px">days to go</div>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
<div style="width: 56px; height: 1px; background: {{accent}}; margin-bottom: 12px"></div>
<div style="font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-weight: 500; font-size: 42px; line-height: 46px">Camila &amp; Andrés</div>
<div style="font-size: 24px; color: #a8a08f; line-height: 32px">21 Mar 2027 · Tarija</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#c9a96e","options":["#c9a96e","#e2c892","#f7f3ec"]},"$preview":{"width":416,"height":496}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#c9a96e' };
}
}
</script>
</body>
</html>
