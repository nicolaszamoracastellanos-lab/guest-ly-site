<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Guest pass</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 416px; height: 496px; box-sizing: border-box; background: #000000; color: #f7f3ec; font-family: 'Jost', system-ui, sans-serif; padding: 30px 24px 26px; display: flex; flex-direction: column; align-items: center; gap: 12px">
<div style="align-self: stretch; padding-left: 12px; height: 40px; font-size: 30px; font-weight: 500; line-height: 40px; color: #c9a96e">Your pass</div>
<div style="width: 252px; height: 252px; box-sizing: border-box; padding: 18px; background: #f7f3ec; border-radius: 30px">
<svg role="img" aria-label="Entry code placeholder" width="216" height="216" viewBox="0 0 25 25" shape-rendering="crispEdges" style="display: block">
<path d="{{qr}}" fill="#14110c"></path>
</svg>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
<div style="font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 44px; line-height: 46px">Valentina Cruz</div>
<div style="font-size: 24px; line-height: 32px; color: #d9d3c6">Party of 2 · Table 7</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":416,"height":496}}'>
class Component extends DCLogic {
renderVals() {
var n = 25, seed = 20270321, d = '';
function finder(x, y) {
var corners = [[0, 0], [n - 7, 0], [0, n - 7]];
for (var i = 0; i < corners.length; i++) {
var cx = corners[i][0], cy = corners[i][1];
if (x >= cx - 1 && x <= cx + 7 && y >= cy - 1 && y <= cy + 7) {
var dx = x - cx, dy = y - cy;
if (dx < 0 || dx > 6 || dy < 0 || dy > 6) return 0;
if (dx === 0 || dx === 6 || dy === 0 || dy === 6) return 1;
if (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4) return 1;
return 0;
}
}
return -1;
}
for (var y = 0; y < n; y++) {
for (var x = 0; x < n; x++) {
seed = (seed * 1103515245 + 12345) % 2147483648;
var f = finder(x, y);
var on = f === -1 ? (seed >> 16) % 2 === 1 : f === 1;
if (on) d += 'M' + x + ' ' + y + 'h1v1h-1z';
}
}
return { qr: d };
}
}
</script>
</body>
</html>
