<!doctype html>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      /* Theme bootstrap: resolve the ladder (stored choice, then OS
         preference, then night) and stamp <html> before first paint. */
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('gl-theme');
        } catch (e) {}
        if (theme !== 'day' && theme !== 'night') {
          theme =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'day'
              : 'night';
        }
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'day' ? '#faf6f0' : '#0d1117');
      })();
    </script>
